# Netlify Configuration (netlify.toml)
# For details on Netlify redirects: https://docs.netlify.com/routing/redirects/

[[redirects]]
  from = "/api/*"
  to = "https://YOUR_RAILWAY_BACKEND.up.railway.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://YOUR_RAILWAY_BACKEND.up.railway.app/uploads/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
